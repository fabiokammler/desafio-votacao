spring:
  datasource:
    url: jdbc:h2:mem:db_votacao_test;MODE=MYSQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  flyway:
    baseline-on-migrate: false
    enabled: false