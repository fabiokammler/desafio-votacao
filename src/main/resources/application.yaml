server:
  port: ${API_BASE_PORT:8080}
  tomcat:
    threads:
      max: 200
spring:
  application:
    name: votacao
  datasource:
    url: jdbc:mysql://${mysql.url}/${mysql.schema}?useSSL=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${mysql.username}
    password: ${mysql.password}
    hikari:
      auto-commit: false
      connection-timeout: 250
      max-lifetime: 600000
      maximum-pool-size: 20
      minimum-idle: 10
      pool-name: master
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      "[hibernate.dialect]": org.hibernate.dialect.MySQLDialect
      "[hibernate.generate_statistics]": true
      "[hibernate.connection.autocommit]": false
  flyway:
    baseline-on-migrate: true
    enabled: true
app:
  api:
    callbacks:
      base-url: ${API_BASE_URL_CALLBACK:http://localhost:8080}
      cadastrar: ${app.api.callbacks.base-url}/v1/pautas
      sessao: ${app.api.callbacks.base-url}/v1/pautas/{id}/abrirSessao
      voto: ${app.api.callbacks.base-url}/v1/pautas/{id}/votos
